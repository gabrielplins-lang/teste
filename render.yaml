# Deploy completo no Render (https://render.com): banco + API + site.
# No painel do Render: New > Blueprint > escolha este repositório. Ele lê este arquivo.

databases:
  - name: feijuca-db
    databaseName: feijuca
    user: feijuca
    plan: basic-256mb # o plano "free" do Render apaga o banco depois de 30 dias

services:
  - type: web
    name: feijuca-api
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci && npm run build -w @feijuca/api && npm run db:deploy -w @feijuca/api && npm run db:seed -w @feijuca/api
    startCommand: npm run start -w @feijuca/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: feijuca-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # você digita a senha do painel no Render
      - key: CORS_ORIGIN
        sync: false # endereço do site, ex.: https://feijuca-web.onrender.com
      - key: PIX_KEY
        sync: false
      - key: PIX_NAME
        value: Feijuca da Lu

  - type: web
    name: feijuca-web
    runtime: static
    buildCommand: npm ci && npm run build -w @feijuca/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false # endereço da API, ex.: https://feijuca-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
