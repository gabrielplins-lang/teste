# Banco PostgreSQL para desenvolvimento local: `npm run db:up`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: feijuca
      POSTGRES_PASSWORD: feijuca
      POSTGRES_DB: feijuca
    ports:
      - "5432:5432"
    volumes:
      - feijuca-db:/var/lib/postgresql/data

volumes:
  feijuca-db:
