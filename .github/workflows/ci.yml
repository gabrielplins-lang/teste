name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: feijuca
          POSTGRES_PASSWORD: feijuca
          POSTGRES_DB: feijuca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U feijuca" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://feijuca:feijuca@localhost:5432/feijuca?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run db:deploy -w @feijuca/api
      - run: npm run db:seed -w @feijuca/api
      - run: npm test
      - run: npm run build
